<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="40%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f111a" />
    </linearGradient>

    <!-- Glowing Cyan/Teal Gradient for Aperture -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Play Button Prism Gradient -->
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="160" stroke="url(#neonCyan)" stroke-width="6" opacity="0.3" filter="url(#outerGlow)" />
  <circle cx="256" cy="256" r="150" stroke="url(#neonCyan)" stroke-width="4" opacity="0.8" />
  <circle cx="256" cy="256" r="136" stroke="url(#neonCyan)" stroke-width="2" opacity="0.5" stroke-dasharray="8 6" />

  <!-- Camera Aperture Blades (Cinematic Studio) -->
  <g stroke="url(#neonCyan)" stroke-width="3.5" opacity="0.9" stroke-linecap="round">
    <line x1="256" y1="106" x2="352" y2="190" />
    <line x1="386" y1="180" x2="386" y2="310" />
    <line x1="386" y1="310" x2="290" y2="394" />
    <line x1="256" y1="406" x2="160" y2="322" />
    <line x1="126" y1="332" x2="126" y2="202" />
    <line x1="126" y1="202" x2="222" y2="118" />
  </g>

  <!-- Central Lens Core -->
  <circle cx="256" cy="256" r="76" fill="#1e1b4b" stroke="url(#neonCyan)" stroke-width="4" filter="url(#neonGlow)" />

  <!-- Central Play Prism -->
  <polygon points="236,214 294,256 236,298" fill="url(#prismGrad)" filter="url(#neonGlow)" />

  <!-- Top Glass Highlight Reflection -->
  <path d="M 64 120 Q 256 60 448 120 C 420 180 340 210 256 210 C 172 210 92 180 64 120 Z" fill="#ffffff" opacity="0.08" />
</svg>
